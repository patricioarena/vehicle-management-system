/*
 * Root build.gradle for guice-practice multi-module project
 */

plugins {
    // Root project has no source code - plugins are declared per submodule
}

allprojects {
    repositories {
        mavenCentral()
    }

    group = 'com.example.vehicle'
    version = '1.0.0'
}

subprojects {
    // Each submodule declares its own plugin (java-library or application)
    // but we ensure JVM version is set for all Java submodules
    plugins.withId('java') {
        java {
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = JavaVersion.VERSION_21
        }
    }

    plugins.withId('java-library') {
        java {
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = JavaVersion.VERSION_21
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    // JaCoCo configuration for code coverage
    plugins.withId('jacoco') {
        jacoco {
            toolVersion = '0.8.11'
        }

        tasks.withType(Test).configureEach {
            finalizedBy jacocoTestReport
        }

        // Configure JaCoCo test report
        jacocoTestReport {
            dependsOn test
            reports {
                xml.required = true
                html.required = true
            }
            afterEvaluate {
                classDirectories.setFrom(files(classDirectories.files.collect {
                    fileTree(dir: it, exclude: ['**/AppModule.class', '**/Main.class', '**/app.api.Main', '**/app.cli.Main'])
                }))
            }
        }

        // Coverage verification task
        // MINIMUM COVERAGE RULES - DO NOT MODIFY
        // vehicle-core: 93% minimum (currently 96%)
        // vehicle-api: 60% verification minimum (91% report, catch Exception not testable)
        jacocoTestCoverageVerification {
            dependsOn test
            violationRules {
                // Overall minimum: 60% (verification baseline)
                rule {
                    limit {
                        minimum = 0.60
                    }
                }
                // Per-class coverage (excludes auto-generated and boilerplate classes)
                rule {
                    element = 'CLASS'
                    limit {
                        counter = 'LINE'
                        minimum = 0.60
                    }
                    excludes = [
                        '*.*Builder',
                        '*.*Builder*',
                        '*.*Module',
                        '*Main',
                        '*.model.*',
                        '*.constant.*',
                        '*.exception.*',
                        '*.custom.exception.*',
                        '*.config.*',
                        '*Mapper*'
                    ]
                }
            }
        }

        // Optional: don't fail the build on coverage verification during development
        // Uncomment the line below to disable coverage verification temporarily
        // jacocoTestCoverageVerification.enabled = false

        check.dependsOn jacocoTestCoverageVerification
    }
}
